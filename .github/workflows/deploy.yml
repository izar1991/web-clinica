name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AI prompt
        run: npm run ai:prompt

      - name: Validate generated AI prompt
        run: npm run ai:prompt:check

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-ai-prompt:
    name: Sync AI prompt to external server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate AI prompt
        run: npm run ai:prompt

      - name: Upload AI prompt over SSH
        env:
          SERVER_HOST: ${{ secrets.AI_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AI_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AI_SERVER_PORT }}
          SERVER_PATH: ${{ secrets.AI_SERVER_PATH }}
          SERVER_SSH_KEY: ${{ secrets.AI_SERVER_SSH_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SERVER_PATH" ] || [ -z "$SERVER_SSH_KEY" ]; then
            echo "AI server secrets are not configured; skipping prompt upload."
            exit 0
          fi

          printf '%s\n' "$SERVER_SSH_KEY" > "$RUNNER_TEMP/ai-server-key"
          chmod 600 "$RUNNER_TEMP/ai-server-key"
          mkdir -p "$HOME/.ssh"
          ssh-keyscan -p "${SERVER_PORT:-22}" -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          scp -P "${SERVER_PORT:-22}" -i "$RUNNER_TEMP/ai-server-key" \
            docs/instrucciones_ia.txt \
            "$SERVER_USER@$SERVER_HOST:$SERVER_PATH/instrucciones_ia.txt"
